name: Upload Service Account Credentials (Staging)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      KINSTA_HOST: ${{ secrets.KINSTA_HOST }}
      KINSTA_USER: ${{ secrets.KINSTA_USER }}
      KINSTA_PORT: ${{ secrets.KINSTA_PORT }}
      KINSTA_SSH_KEY: ${{ secrets.KINSTA_SSH_KEY }}
      KINSTA_PLUGINS_BASE: ${{ secrets.KINSTA_PLUGINS_BASE }}
      GMC_SERVICE_ACCOUNT_JSON: ${{ secrets.GMC_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.KINSTA_SSH_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${KINSTA_PORT:-22}" "${KINSTA_HOST}" >> ~/.ssh/known_hosts

      - name: Validate secret
        run: |
          if [ -z "${GMC_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GMC_SERVICE_ACCOUNT_JSON secret is empty!"
            exit 1
          fi
          # Validate JSON format
          echo "${GMC_SERVICE_ACCOUNT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Valid JSON with', len(d), 'keys:', ', '.join(d.keys()))"

      - name: Upload service account JSON
        run: |
          # Store in wp-content/uploads/hp-gmc-private/ - accessible to PHP but protected by .htaccess
          CREDS_PATH="${KINSTA_PLUGINS_BASE%/plugins}/uploads/hp-gmc-private"
          
          echo "=== Configuration ==="
          echo "PLUGINS_BASE: ${KINSTA_PLUGINS_BASE}"
          echo "CREDENTIALS_PATH: ${CREDS_PATH}"
          echo "TARGET FILE: ${CREDS_PATH}/gmc-service-account.json"
          
          echo ""
          echo "=== Step 1: Create credentials directory ==="
          ssh -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" "mkdir -p '${CREDS_PATH}'"
          
          echo ""
          echo "=== Step 2: Create .htaccess to block direct access ==="
          ssh -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" "cat > '${CREDS_PATH}/.htaccess'" << 'HTACCESS'
          # Deny all direct access to files in this directory
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order deny,allow
              Deny from all
          </IfModule>
          HTACCESS
          
          echo ""
          echo "=== Step 3: Create index.php for extra protection ==="
          ssh -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" "echo '<?php // Silence is golden' > '${CREDS_PATH}/index.php'"
          
          echo ""
          echo "=== Step 4: Write JSON file ==="
          echo "${GMC_SERVICE_ACCOUNT_JSON}" | ssh -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" "cat > '${CREDS_PATH}/gmc-service-account.json'"
          
          echo ""
          echo "=== Step 5: Set permissions ==="
          ssh -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" "chmod 600 '${CREDS_PATH}/gmc-service-account.json'"
          
          echo ""
          echo "=== Step 6: Verify files ==="
          ssh -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" "ls -la '${CREDS_PATH}/'"
          
          echo ""
          echo "=== Step 7: Validate JSON on server ==="
          ssh -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" "python3 -c \"import json; f=open('${CREDS_PATH}/gmc-service-account.json'); d=json.load(f); print('Valid JSON:', d.get('type'), d.get('client_email'))\""
          
          echo ""
          echo "=== SUCCESS ==="
          echo "Service account uploaded to: ${CREDS_PATH}/gmc-service-account.json"
          echo ""
          echo "UPDATE YOUR PLUGIN SETTINGS TO USE THIS PATH:"
          echo "${CREDS_PATH}/gmc-service-account.json"
