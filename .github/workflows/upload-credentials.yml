name: Upload Service Account Credentials

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      KINSTAPROD_HOST: ${{ secrets.KINSTAPROD_HOST }}
      KINSTAPROD_USER: ${{ secrets.KINSTAPROD_USER }}
      KINSTAPROD_PORT: ${{ secrets.KINSTAPROD_PORT }}
      KINSTAPROD_SSH_KEY: ${{ secrets.KINSTAPROD_SSH_KEY }}
      KINSTAPROD_PLUGINS_BASE: ${{ secrets.KINSTAPROD_PLUGINS_BASE }}
      GMC_SERVICE_ACCOUNT_JSON: ${{ secrets.GMC_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.KINSTAPROD_SSH_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${KINSTAPROD_PORT:-22}" "${KINSTAPROD_HOST}" >> ~/.ssh/known_hosts

      - name: Validate secret
        run: |
          if [ -z "${GMC_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GMC_SERVICE_ACCOUNT_JSON secret is empty!"
            exit 1
          fi
          # Validate JSON format
          echo "${GMC_SERVICE_ACCOUNT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Valid JSON with', len(d), 'keys:', ', '.join(d.keys()))"

      - name: Upload service account JSON
        run: |
          # Determine private folder path (sibling to public)
          PRIVATE_PATH="${KINSTAPROD_PLUGINS_BASE%/public/wp-content/plugins}/private"
          
          echo "=== Configuration ==="
          echo "PLUGINS_BASE: ${KINSTAPROD_PLUGINS_BASE}"
          echo "PRIVATE_PATH: ${PRIVATE_PATH}"
          echo "TARGET FILE: ${PRIVATE_PATH}/gmc-service-account.json"
          
          echo ""
          echo "=== Step 1: Create private directory ==="
          ssh -p "${KINSTAPROD_PORT:-22}" "${KINSTAPROD_USER}@${KINSTAPROD_HOST}" "mkdir -p '${PRIVATE_PATH}' && ls -la '${PRIVATE_PATH}/'"
          
          echo ""
          echo "=== Step 2: Write JSON file ==="
          echo "${GMC_SERVICE_ACCOUNT_JSON}" | ssh -p "${KINSTAPROD_PORT:-22}" "${KINSTAPROD_USER}@${KINSTAPROD_HOST}" "cat > '${PRIVATE_PATH}/gmc-service-account.json'"
          
          echo ""
          echo "=== Step 3: Set permissions ==="
          ssh -p "${KINSTAPROD_PORT:-22}" "${KINSTAPROD_USER}@${KINSTAPROD_HOST}" "chmod 600 '${PRIVATE_PATH}/gmc-service-account.json'"
          
          echo ""
          echo "=== Step 4: Verify file ==="
          ssh -p "${KINSTAPROD_PORT:-22}" "${KINSTAPROD_USER}@${KINSTAPROD_HOST}" "ls -la '${PRIVATE_PATH}/gmc-service-account.json'"
          
          echo ""
          echo "=== Step 5: Validate JSON on server ==="
          ssh -p "${KINSTAPROD_PORT:-22}" "${KINSTAPROD_USER}@${KINSTAPROD_HOST}" "python3 -c \"import json; f=open('${PRIVATE_PATH}/gmc-service-account.json'); d=json.load(f); print('Valid JSON:', d.get('type'), d.get('client_email'))\""
          
          echo ""
          echo "=== SUCCESS ==="
          echo "Service account uploaded to: ${PRIVATE_PATH}/gmc-service-account.json"
